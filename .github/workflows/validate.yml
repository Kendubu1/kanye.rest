name: Validate Sean.rest data

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  validate:
    name: Validate bars and projects
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run data validation
        run: npm test
